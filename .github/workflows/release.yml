name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（如 v1.9.2）"
        required: true
        type: string

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "20"
  IMAGE_PLATFORMS: linux/amd64,linux/arm64

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release (GoReleaser)
      packages: write # container image on GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            RAW_TAG="${INPUT_VERSION}"
          else
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          fi
          RAW_TAG="${RAW_TAG#v}"
          # X.Y.Z or X.Y.Z-prerelease: what the dockerfile's VERSION check accepts,
          # minus "+build" metadata, which an image tag cannot contain. Checked
          # here so a bad tag fails before anything is published.
          semver_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! "${RAW_TAG}" =~ ${semver_re} ]]; then
            echo "Invalid version '${RAW_TAG}': expected vX.Y.Z or vX.Y.Z-prerelease" >&2
            exit 1
          fi
          echo "tag=v${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "semver=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing version: ${RAW_TAG}"

      - name: Resolve image name
        id: image
        # GHCR repository names must be lowercase; the owner login may not be.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/scopesentry" >> "$GITHUB_OUTPUT"

      - name: Create tag (manual release)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"

      # The frontend and Go stages of the dockerfile cross-compile on the runner;
      # only the runtime stage's apt-get runs as the target platform, so arm64
      # needs QEMU.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The multi-stage dockerfile builds the frontend and the binary itself, so
      # this runs on the clean checkout, before the steps below modify
      # cmd/main/static. It also runs before GoReleaser: a failed image build
      # leaves no GitHub Release behind, and re-pushing the tags on a re-run is
      # harmless.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.semver }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.semver }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.semver }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend to dist-pro
        working-directory: frontend
        env:
          HUSKY: "0"
        run: |
          npm ci
          npx vite build --mode pro
          test -d dist-pro || (echo "frontend/dist-pro not found after build" >&2 && exit 1)

      - name: Overlay frontend into cmd/main/static
        run: |
          # 将 dist-pro 产物覆盖合并到 static，保留 static 中 draco/lib/plugins 等其他模块
          rsync -a frontend/dist-pro/ cmd/main/static/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          # CI 会将新构建的前端覆盖进 static，跳过 dirty 校验
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          {
            echo "## Release ${{ steps.version.outputs.tag }}"
            echo ""
            echo "- GitHub Release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"
            echo "- Image: \`${{ steps.image.outputs.name }}:${{ steps.version.outputs.semver }}\` (${{ env.IMAGE_PLATFORMS }})"
            echo "- Image (latest): \`${{ steps.image.outputs.name }}:latest\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
