# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: ScopeSentry
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
    env:
      - GOAMD64=v1
    main: ./cmd/main/main.go
    binary: ScopeSentry
    ldflags:
      - -s -w
      - -X github.com/Autumn-27/ScopeSentry/internal/constants.Version={{.Version}}

archives:
  - id: default
    ids:
      - ScopeSentry
    formats:
      - zip
    name_template: "ScopeSentry_{{ .Os }}_{{ .Arch }}"

changelog:
  disable: true

release:
  # No github owner/name: GoReleaser then releases to the repository of the
  # "origin" remote, which actions/checkout points at the repository running
  # the workflow, the same owner the GHCR image in release.yml is pushed under.
  name_template: "ScopeSentry {{.Version}}"

dist: ./dist
